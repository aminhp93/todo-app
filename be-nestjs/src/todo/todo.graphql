type Todo {
  id: ID!
  title: String!
  completed: Boolean!
  createdAt: String!
}

type DeleteTodoResult {
  message: String!
  todo: Todo!
}

type Query {
  todos: [Todo!]!
  todo(id: ID!): Todo
}

type Mutation {
  createTodo(title: String!): Todo!
  updateTodo(id: ID!, title: String, completed: Boolean): Todo!
  deleteTodo(id: ID!): DeleteTodoResult!
}
